<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020"><meta name="csrf-token" content="{{ csrf_token }}"><meta name="stockwise-user" content="{{ current_user.id if current_user else 'guest' }}"><title>{% block title %}Stockwise{% endblock %} · Stockwise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js" defer></script>
  <script src="{{ url_for('static', filename='js/app.js', v=2) }}" defer></script>
</head>
<body class="{% block body_class %}{% endblock %}">
{% block content %}{% endblock %}
{% with messages = get_flashed_messages(with_categories=true) %}{% if messages %}<div class="toast-stack" id="toastStack">{% for category, message in messages %}<div class="toast {{ category }}">{{ message }}</div>{% endfor %}</div>{% endif %}{% endwith %}
</body></html>
